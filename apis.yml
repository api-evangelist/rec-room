name: Rec Room
description: 'Rec Room is a cross-platform social gaming and user-generated-content platform where players
  hang out, play, and build their own rooms and games using in-app creation tools (Rec Room Studio and the
  visual Circuits scripting system). It runs on PC, PlayStation, Xbox, Meta Quest VR, iOS, and Android with
  a shared avatar and economy. Founded in 2016 (originally as Against Gravity) and headquartered in Seattle,
  the company is backed by Index Ventures among other investors. Rec Room publishes a consumer platform at
  rec.net; no official public developer API or documented developer program was found during enrichment (the
  site is served behind Cloudflare and an internal api.rec.net host exists but is undocumented/unofficial).'
